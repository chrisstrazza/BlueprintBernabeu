<style>
:root{--bg:#F5F4F0;--sf:#fff;--sf2:#EFEEE9;--tx:#17191C;--tx2:#6A6E73;--bd:#D9D9D5;--ac:#365F78;--acs:#365F7814;--ok:#2F6B45;--warn:#9A6A12;--bad:#8A2A2A;--sh:0 1px 2px #0000000f,0 6px 20px #0000000a}
:root[data-t=dark]{--bg:#111316;--sf:#1B1E22;--sf2:#23272C;--tx:#F4F4F1;--tx2:#A3A7AC;--bd:#34383D;--ac:#7597AD;--acs:#7597AD1f;--ok:#6FB38A;--warn:#D9A441;--bad:#D26B6B;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 28px)}
#app.hastabs{padding-bottom:calc(env(safe-area-inset-bottom) + 92px)}
h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:700;margin:0;line-height:1.15}h1{font-size:2.4rem}h2{font-size:1.75rem}h3{font-size:1.2rem}
.mono{font-family:'IBM Plex Mono',monospace}.mut{color:var(--tx2);font-size:.88rem}.c{text-align:center}
.eyebrow{font:500 .7rem 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--tx2);margin:0 0 6px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0;box-shadow:var(--sh)}
.fade{animation:fd .22s ease-out}@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.top{display:flex;align-items:center;gap:10px;padding:2px 0 10px;border-bottom:1px solid var(--bd);margin-bottom:6px}
.top b{font:700 1.15rem 'Cormorant Garamond',serif;letter-spacing:.04em;flex:1}.top .lg{height:30px;width:auto}
.ib{width:40px;min-height:40px;padding:0;margin:0;display:inline-flex;align-items:center;justify-content:center;border-radius:10px}
button{font:inherit;font-weight:600;border-radius:12px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:12px 16px;min-height:48px;cursor:pointer;width:100%;margin:5px 0;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,border-color .15s,background .15s}
button:hover{border-color:var(--ac)}button:active{transform:scale(.98)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.p{background:var(--ac);border-color:var(--ac);color:var(--bg)}button.d{color:var(--bad);border-color:var(--bad);background:transparent}button.g{border-color:transparent;background:transparent;color:var(--tx2)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}.i{flex:none}
input,select{font:inherit;width:100%;padding:12px 14px;min-height:48px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);margin:2px 0 12px}
label{font-size:.8rem;font-weight:600;color:var(--tx2);letter-spacing:.02em}
.logo{display:block;margin:18px auto 8px;width:min(250px,68%);height:auto}.lw{display:none}[data-t=dark] .ln{display:none}[data-t=dark] .lw{display:block}
.hero{padding:6px 0 4px;text-align:center}.hero .q{font:italic 600 1.15rem 'Cormorant Garamond',serif;margin:6px 0 4px}
.av{border-radius:50%;object-fit:cover;background:var(--sf2);border:2px solid var(--bd);flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:600;color:var(--tx2)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.ch{position:relative;border:1.5px solid var(--bd);border-radius:12px;background:var(--sf);padding:6px 4px 8px;text-align:center;font-size:.78rem;line-height:1.2;cursor:pointer;transition:.12s}
.ch img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--sf2);display:block;margin-bottom:5px}
.ch.on{border-color:var(--ac);background:var(--acs)}.ch.on:after{content:'✓';position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--ac);color:var(--bg);font-size:12px;display:flex;align-items:center;justify-content:center}
.ch.ro{cursor:default}.ch.dim{opacity:.35}
.tag{display:inline-block;font:500 .66rem 'IBM Plex Mono',monospace;border:1px solid var(--bd);border-radius:99px;padding:1px 8px;color:var(--tx2);margin-top:3px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}.row .gr{flex:1;min-width:0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bd);flex:none}.dot.on{background:var(--ok);box-shadow:0 0 0 3px #2f6b4524}
.code{font:600 2.3rem 'IBM Plex Mono',monospace;letter-spacing:.22em;text-align:center;margin:4px 0 2px;padding-left:.22em}
.qr{width:150px;height:150px;margin:8px auto;padding:8px;background:#fff;border-radius:12px;border:1px solid var(--bd)}.qr svg{width:100%;height:100%;display:block}
.bar{height:6px;background:var(--sf2);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.msg{padding:12px 14px;border-radius:12px;border:1px solid var(--warn);color:var(--warn);margin:10px 0;font-size:.9rem;background:var(--sf)}
.msg.bad{border-color:var(--bad);color:var(--bad)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat div{background:var(--sf2);border-radius:10px;padding:10px 12px}.stat b{display:block;font:600 1.6rem 'IBM Plex Mono',monospace}
.sec{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;border:1.5px dashed var(--bd);border-radius:12px;background:var(--sf2);font:600 1.2rem 'IBM Plex Mono',monospace;letter-spacing:.12em;user-select:none;-webkit-user-select:none;touch-action:none;cursor:pointer}
.sec.show{border-style:solid;border-color:var(--ac);background:var(--acs)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--sf);border-top:1px solid var(--bd);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px)}
.tabs button{flex:1;flex-direction:column;gap:2px;border:0;background:none;margin:0;min-height:54px;padding:4px;font-size:.68rem;font-weight:500;color:var(--tx2);border-radius:10px}
.tabs button.on{color:var(--ac);background:var(--acs)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:.88rem;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:90vw;text-align:center}
#toast.s{opacity:1;transform:translate(-50%,0)}#toast.e{background:var(--bad);color:#fff}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:16px}
.ov .card{width:100%;max-width:520px;margin:0 0 env(safe-area-inset-bottom)}
.sk{height:64px;border-radius:12px;background:linear-gradient(90deg,var(--sf2),var(--sf),var(--sf2));background-size:200%;animation:sk 1.2s infinite;margin:12px 0}@keyframes sk{to{background-position:-200% 0}}
.dbg{font:.74rem/1.5 'IBM Plex Mono',monospace;white-space:pre-wrap;word-break:break-word}.ok{color:var(--ok)}.bad{color:var(--bad)}
.two{display:flex;gap:8px}.two button{flex:1}
.logo{width:min(250px,68%);color:var(--tx)}svg.av{overflow:hidden;display:block;background:var(--sf2)}.ch .ci{width:100%;aspect-ratio:1;border-radius:8px;background:var(--sf2);display:block;margin-bottom:5px}
.tl{font:600 1.6rem 'IBM Plex Mono',monospace}.opt{flex-direction:column;align-items:stretch;text-align:left;gap:2px}.opt .cost{font:500 .72rem 'IBM Plex Mono',monospace;color:var(--tx2)}.opt.on{border-color:var(--ac);background:var(--acs)}
.ev{border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:10px;padding:12px;margin:10px 0;background:var(--sf)}
.badge{font:600 .62rem 'IBM Plex Mono',monospace;letter-spacing:.06em;border:1px solid currentColor;border-radius:99px;padding:2px 8px}.badge.ok{color:var(--ok)}.badge.warn{color:var(--warn)}.badge.bad{color:var(--bad)}.warn{color:var(--warn)}
.frg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}.frg div{border:1.5px dashed var(--bd);border-radius:10px;padding:8px 4px;text-align:center;font-size:.72rem}.frg div.on{border:1.5px solid var(--ac);background:var(--acs)}.frg b{display:block;font:600 .95rem 'IBM Plex Mono',monospace;margin-top:2px}
.tv{max-width:1280px;margin:0 auto;padding:24px}.tvh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--bd);padding-bottom:10px;margin-bottom:16px;font:700 1.6rem 'Cormorant Garamond',serif}
.tvg{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:20px}.sus{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center;font-size:.8rem}.sus div{display:flex;flex-direction:column;align-items:center;gap:4px}.wall{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media(max-width:800px){.tvg{grid-template-columns:1fr}}
.opt.on:disabled{opacity:1}.opt:disabled:not(.on){opacity:.55}

function mkDos(g){const rnd=rngFrom((g.seed^0x51ed)>>>0),bag=a=>{let q=[];return()=>{if(!q.length)q=shuffle(a,rnd);return q.pop()}},s1=bag(SEG),c1=bag(COV),b1=bag(BUG),o1=bag(OBJ),d={};
 g.pl.forEach(p=>{const ant=g.roles[p.id]!=='investigatore';d[p.id]={seg:ant?c1():s1(),info:['Il Rettore non è alla quota '+pk(QU.filter(q=>q!==g.caso.q),rnd)+'.','Il documento originale non è custodito in '+pk(LU.filter(l=>l!==g.caso.doc),rnd)+'.'],bug:b1(),obj:o1()}});return d}

/* ============ Motore dei round (solo host) ============ */
const PHN={apertura:'Apertura',appello:'Appello',discussione:'Discussione',decisione:'Decisione',ballot:'Ballottaggio',risoluzione:'Risoluzione'};
const secs=(g,s)=>Math.max(300,Math.round(s*1000*(g.k||1)));
const cardView=c=>({id:c.id,cat:c.cat,pos:c.pos,t:c.t,x:c.x,o:c.o.map(o=>({id:o.id,l:o.l,c:o.c,a:o.a||0}))});
function pickCard(g,ch,n){const pos=n===1?'spina':n===4?'svolta':'indagine',u=g.v.used;
 if(pos==='svolta'&&!u.includes('c1i2'))return CARDS.find(c=>c.id==='c1i2'); // garanzia: il frammento è sempre offerto
 const pool=CARDS.filter(c=>c.ch===ch&&c.pos===pos&&!u.includes(c.id));if(!pool.length)return CARDS.find(c=>c.id==='c1r');
 const rnd=rngFrom((g.seed^(ch*977+n*131))>>>0);let x=rnd()*pool.reduce((s,c)=>s+(c.w||1),0);for(const c of pool){x-=c.w||1;if(x<=0)return c}return pool[0]}
function openRound(g,ch,n){const card=ch===0?CARDS[0]:pickCard(g,ch,n);g.v.used.push(card.id);g.r={ch,n,card,ph:'apertura',end:Date.now()+secs(g,20),votes:{},bd:0,ballot:null,res:null}}
function startPlay(g){g.v={tempo:g.cfg.tempo,allarme:0,fr:{},ev:[],log:[],ex:{q:[],d:[]},used:[]};openRound(g,0,0)}
function resolve(g,oid){const r=g.r,o=r.card.o.find(x=>x.id===oid),v=g.v,rnd=rngFrom((g.seed^(v.ev.length*31+r.n*7+r.ch))>>>0),t0=v.tempo;
 v.tempo=Math.max(0,v.tempo-o.c);v.allarme=Math.min(5,v.allarme+(o.a||0));
 const evs=(o.ev||[]).map(k=>EVB[k](g.caso,g,rnd)).map((e,i)=>({id:'e'+(v.ev.length+i+1),aff:'V',ch:r.ch,n:r.n,...e}));v.ev.push(...evs);
 r.res={o:o.id,l:o.l,dt:t0-v.tempo,da:o.a||0,ev:evs.map(e=>e.id)};v.log.push('Cap. I · R'+r.n+': '+r.card.t+' → '+o.l);r.ph='risoluzione';r.end=Date.now()+secs(g,10)}
function nextRound(g){const r=g.r;if(g.v.tempo<=0&&r.ch>0){g.st='finale';return}
 if(r.ch===0)return openRound(g,1,1);if(r.n<4)return openRound(g,r.ch,r.n+1);g.st='fine'}
function adv(g){const r=g.r,now=Date.now();
 if(r.ph==='apertura'){if(r.ch===0){r.ph='appello';r.order=shuffle(g.pl.map(p=>p.id),rngFrom((g.seed^7)>>>0));r.t0=now;r.ai=0;r.end=now+r.order.length*secs(g,15)}else{r.ph='discussione';r.end=now+secs(g,g.cfg.ritmo)}}
 else if(r.ph==='appello'||r.ph==='risoluzione')nextRound(g);
 else if(r.ph==='discussione'){if(r.card.o.length){r.ph='decisione';r.end=now+secs(g,40)}else nextRound(g)}
 else if(r.ph==='decisione'||r.ph==='ballot'){const opts=r.ballot||r.card.o.map(o=>o.id),cnt={};opts.forEach(o=>cnt[o]=0);Object.values(r.votes).forEach(o=>{if(o in cnt)cnt[o]++});
  const mx=Math.max(...Object.values(cnt)),top=opts.filter(o=>cnt[o]===mx);
  if(mx>0&&top.length>1&&!r.bd){r.bd=1;r.ballot=top;r.votes={};r.ph='ballot';r.end=now+secs(g,20)}else resolve(g,mx>0&&top.length===1?top[0]:r.card.d)}}
function tick(){const g=G;if(!g||g.st!=='play'||!g.r)return;const r=g.r;let ch=0;
 if(g.local&&(r.ph==='decisione'||r.ph==='ballot'))g.pl.forEach(p=>{if(p.bot&&!(p.id in r.votes)){const os=r.ballot||r.card.o.map(o=>o.id);r.votes[p.id]=os[Math.floor(Math.random()*os.length)];ch=1}});
 if(r.ph==='appello'){const i=Math.min(r.order.length-1,Math.floor((Date.now()-r.t0)/secs(g,15)));if(i!==r.ai){r.ai=i;ch=1}}
 if(Date.now()>=r.end){ch=1;adv(g)}if(ch)push()}

/* ============ Rete: modello host-autoritativo su Supabase Realtime ============ */
function mk(t,on){return new Promise((res,rej)=>{let d=0;const tm=setTimeout(()=>{if(!d){d=1;rej(new Error('timeout'))}},12000);const c=sb.channel(t,{config:{broadcast:{self:false}}});
 c.on('broadcast',{event:'m'},({payload})=>on(payload)).subscribe(s=>{if(d)return;if(s==='SUBSCRIBED'){d=1;clearTimeout(tm);res(c)}else if(s==='CHANNEL_ERROR'||s==='TIMED_OUT'){d=1;clearTimeout(tm);rej(new Error(s))}})})}
const snd=(c,p)=>c.send({type:'broadcast',event:'m',payload:p});
async function toP(id,m){try{if(id===ME.id)return onPriv(m);if(S.local||!sb)return;if(!out[id])out[id]=mk(topic('p-'+id),()=>{});snd(await out[id],m)}catch(e){log('toP '+e.message,'e')}}
const say=p=>{p.id=ME.id;if(S.host)hostMsg(p);else if(up)snd(up,p).catch(e=>log('say '+e.message,'e'))};
let lc=0;function startLoop(){clearInterval(pt);pt=setInterval(()=>{if(!G)return;tick();if(++lc%4===0)push()},S.local?300:1000)}
async function connectDisp(){try{sb=sb||supabase.createClient(CFG.url,CFG.key);await mk(topic('bus'),onBus);setTimeout(()=>{if(!S.pub){S.err='Nessuna partita trovata con questo codice.';render()}},8000)}catch(e){S.err='Collegamento non riuscito ('+e.message+')';render()}}
async function connect(){
 if(!S.local){if(!window.supabase||!CFG.url)throw new Error('Libreria Supabase non disponibile: controlla la connessione.');sb=sb||supabase.createClient(CFG.url,CFG.key);
  if(S.host){bus=await mk(topic('bus'),()=>{});hch=await mk(topic('h'),hostMsg)}
  else{pc=await mk(topic('p-'+ME.id),onPriv);await mk(topic('bus'),onBus);up=await mk(topic('h'),()=>{})}}
 localStorage.bbS=JSON.stringify({code:S.code,host:S.host});
 if(S.host){startLoop();push()}
 else{const beat=()=>say(S.pub&&(S.pub.st==='lobby'||S.priv)?{t:'hb'}:{t:'join',name:ME.name});beat();clearInterval(hb);hb=setInterval(beat,3000);
  clearTimeout(nr);nr=setTimeout(()=>{if(!S.pub)noRoom()},7000)}}
function noRoom(){const c=S.code;stop(1);go('join','Nessuna partita trovata con il codice '+c+'. Controlla il codice o riprova tra poco.')}
function stop(clear){clearInterval(hb);clearInterval(pt);clearTimeout(nr);try{[bus,hch,up,pc,...Object.values(out)].forEach(c=>c&&c.then?c.then(x=>sb.removeChannel(x)):c&&sb&&sb.removeChannel(c))}catch(e){}bus=hch=up=pc=null;for(const k in out)delete out[k];
 S.pub=S.priv=null;S.host=false;S.local=false;S.tab='partita';if(clear){localStorage.removeItem('bbS');localStorage.removeItem('bbG')}G=null}

/* --- host --- */
const save=()=>{if(G&&!S.local)localStorage.bbG=JSON.stringify(G)};
function pubOf(){const g=G,v=g.v,r=g.r;return{st:g.st,name:g.name,code:g.code,cfg:g.cfg,roster:g.roster,hid:g.hid,t0:g.t0,dt:g.dt,now:Date.now(),chars:g.st==='lobby'?null:g.chars,v:v&&{tempo:v.tempo,allarme:v.allarme,fr:v.fr,ev:v.ev,log:v.log.slice(-12)},r:r&&{ch:r.ch,n:r.n,card:cardView(r.card),ph:r.ph,end:r.end,t0:r.t0,order:r.order,ai:r.ai,vtd:Object.keys(r.votes),ballot:r.ballot,res:r.res},pl:g.pl.map(p=>({id:p.id,name:p.name,on:isOn(p),ack:!!p.ack}))}}
function push(){const g=G;if(g.st==='ready'&&g.pl.every(p=>p.ack)){g.st='play';startPlay(g);log('Tutti hanno letto il dossier → PROLOGO')}save();const m={t:'pub',pub:pubOf()};onBus(m);if(bus)snd(bus,m).catch(e=>log('bus '+e.message,'e'))}
function privOf(p){const g=G,r=g.roles[p.id];return{t:'priv',role:r,dos:g.dos&&g.dos[p.id],mates:r==='investigatore'?[]:g.pl.filter(q=>q.id!==p.id&&g.roles[q.id]!=='investigatore').map(q=>({id:q.id,role:g.roles[q.id]}))}}
const sendPriv=p=>toP(p.id,privOf(p));
function hostMsg(m){const g=G;if(!g||!m||!m.id)return;let p=g.pl.find(x=>x.id===m.id);
 if(m.t==='join'&&!p){const nm=String(m.name||'').trim().slice(0,14);
  if(g.st!=='lobby')return toP(m.id,{t:'deny',why:'started'});if(g.pl.length>=20)return toP(m.id,{t:'deny',why:'full'});
  if(!nm||g.pl.some(x=>x.name.toLowerCase()===nm.toLowerCase()))return toP(m.id,{t:'deny',why:'name'});p={id:m.id,name:nm};g.pl.push(p);log('Entra '+nm)}
 if(!p)return;p.seen=Date.now();
 if(m.t==='leave'&&g.st==='lobby'){g.pl=g.pl.filter(x=>x!==p);log('Esce '+p.name)}
 if(m.t==='ack'&&g.st==='ready')p.ack=1;
 if(m.t==='vote'&&g.st==='play'&&g.r&&(g.r.ph==='decisione'||g.r.ph==='ballot')){const r=g.r;if((r.ballot||r.card.o.map(o=>o.id)).includes(m.o)&&!(p.id in r.votes))r.votes[p.id]=m.o}
 if(m.t==='join'&&g.st!=='lobby')sendPriv(p);
 if(m.t!=='hb')push()}
function hStart(){const g=G;try{const st=prepare(g.pl.map(p=>({id:p.id})),g.roster,newSeed());
  if(!S.local&&g.pl.some(p=>!isOn(p)))throw new Error('Un giocatore risulta scollegato: aspetta che rientri o rimuovilo.');
  g.chars=st.chars;g.roles=st.roles;g.seed=st.seed;g.caso=genCaso(rngFrom((st.seed^0x9e37)>>>0));g.dos=mkDos(g);g.st='ready';g.t0=Date.now();g.pl.forEach(p=>p.ack=p.bot?1:0);log('AVVIO: '+g.pl.length+' giocatori, seme '+g.seed);g.pl.forEach(sendPriv);push()}catch(e){log(e.message,'e');toast(e.message,'e')}}
function newRoom(name,cfg,local){G={code:S.code,name,cfg,dt:genCode().toLowerCase(),k:1,st:'lobby',pl:[{id:ME.id,name:ME.name,seen:Date.now()}],roster:[],hid:ME.id}}

function onBus(m){if(m&&m.t==='pub'){const kk=x=>JSON.stringify(x,(a,b)=>a==='now'?0:b),same=kk(m.pub)===kk(S.pub);S.off=m.pub.now-Date.now();S.pub=m.pub;if(same)return;S.seen=Date.now();clearTimeout(nr);if(S.screen==='joining')S.screen='room';if(S.screen==='room'||S.screen==='tavola')render()}else if(m&&m.t==='closed'){stop(1);go('home');toast('L’organizzatore ha chiuso la stanza','e')}}

if(u.get('tavola')&&/^[A-HJ-NP-Z2-9]{6}$/i.test(u.get('tavola'))){S.code=u.get('tavola').toUpperCase();S.dk=u.get('k')||'';S.screen='tavola';connectDisp()}
else if(u.get('debug'))S.screen='debug';
else if(u.get('room')&&/^[A-HJ-NP-Z2-9]{6}$/i.test(u.get('room'))){S.code=u.get('room').toUpperCase();S.screen='join'}
else{let ss=null;try{ss=JSON.parse(localStorage.bbS||'null')}catch(e){}
 if(ss&&ss.code&&ME.name){S.code=ss.code;S.host=!!ss.host;try{if(S.host){G=JSON.parse(localStorage.bbG||'null');if(!G||G.code!==S.code)throw 0}}catch(e){localStorage.removeItem('bbS');S.host=false;ss=null}
  if(ss){S.screen='joining';connect().catch(x=>{log(x.message,'e');stop(1);go('home')})}}}
